# /etc/nginx/sites-available/lonewolf  (symlink into sites-enabled)
server {
    listen 80;
    listen [::]:80;
    server_name lonewolfdigitech.com www.lonewolfdigitech.com;

    root /var/www/lonewolf;
    index index.html;

    # Old WordPress pages land on the matching section of the new one-page site
    location = /about-us/          { return 301 /#top; }
    location = /services/          { return 301 /#services; }
    location = /portfolio/         { return 301 /#work; }
    location = /contact-us/        { return 301 /#contact; }
    location = /get-started/       { return 301 /#contact; }
    location = /branding-questionnaire/ { return 301 /#contact; }
    location = /client-register/   { return 301 /#contact; }
    location = /client-login/      { return 301 https://portal.lonewolfdigitech.com; }

    location / { try_files $uri $uri/ =404; }

    location ~* \.(webp|png|svg|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
